# Checks the request's X-Api-Version
# If its value is 2, it returns a 400 Bad Request response with a custom error message
on_http_request:
  - name: Deprecate API v2
    expressions:
      - "'2' in req.headers['X-Api-Version']"
    actions:
      - type: custom-response
        config:
          status_code: 400
          body: '{"error":{"message":"Version 2 of the API is no longer supported. Use Version 3 instead."}}'
