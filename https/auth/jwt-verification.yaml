# This rule adds jwt key-based rate limiting to your endpoints based on your consumers' JWTs. See the Auth0 guide for more information.
# https://ngrok.com/docs/integrations/auth0/jwt-action/
# Update YOUR-AUTH-PROVIDER and YOUR-NGROK-DOMAIN before using this policy.
on_http_request:
  - name: Add JWT authentication and rate limiting
    actions:
      - type: rate-limit
        config:
          name: Only allow 30 requests per minute
          algorithm: sliding_window
          capacity: 30
          rate: 60s
          bucket_key:
            - req.headers['authorization']
      - type: jwt-validation
        config:
          issuer:
            allow_list:
              - value: https://<YOUR-AUTH-PROVIDER>
          audience:
            allow_list:
              - value: <YOUR-NGROK-DOMAIN>
          http:
            tokens:
              - type: jwt
                method: header
                name: Authorization
                prefix: "Bearer "
          jws:
            allowed_algorithms:
              - RS256
            keys:
              sources:
                additional_jkus:
                  - https://devoted-unicorn-2.clerk.accounts.dev/.well-known/jwks.json # Example for Clerk, replace with your provider's JWKS URL
